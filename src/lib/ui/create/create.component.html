<page-actions
  (save)="onSave()"
  [disabled]="{
    save: formGroup.invalid
  }"
></page-actions>
<div class="main-content">
  <div class="row">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header"><strong>New User</strong></div>
        <div class="card-body">
          <form autocomplete="off" [formGroup]="formGroup">
            <div class="form-group required">
              <with-validation>
                <label class="form-label">Name</label>
                <input validate type="text" formControlName="name" class="form-control" placeholder="Full name" required />
              </with-validation>
            </div>
            <div class="form-group required mt-2">
              <with-validation>
                <label class="form-label">Email</label>
                <input validate type="text" formControlName="email" class="form-control" placeholder="email@example.com" required email />
              </with-validation>
            </div>
            <div class="form-group mt-2">
              <with-validation>
                <label class="form-label">Gender</label>
                <select-control validate formControlName="gender" [options]="[{value:'male',name:'Male'},{value:'female',name:'Female'}]" optionKey="value" optionField="name" placeholder="Select Gender"></select-control>
              </with-validation>
            </div>
            <div class="form-group mt-2">
              <with-validation>
                <label class="form-label">Date of Birth</label>
                <input validate type="text" formControlName="birth" class="form-control" placeholder="Date of Birth" bsDatepicker />
              </with-validation>
            </div>
            <div class="form-group required mt-2">
              <with-validation>
                <label class="form-label">Password</label>
                <input validate type="password" formControlName="password" class="form-control" placeholder="Minimum 8 characters" required minlength="8" />
              </with-validation>
            </div>
            <div class="form-group required mt-2">
              <with-validation>
                <label class="form-label">Confirm Password</label>
                <input validate type="password" formControlName="confirmPassword" class="form-control" placeholder="Re-enter password" required equalTo="password" />
              </with-validation>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
