<page-title [title]="'Users'"></page-title>
<page-actions (create)="showChildComponent(childComponents.createUser, 'createUser')"></page-actions>
<app-offcanvas id="user-forms" [title]="childComponentSelected && childComponentSelected?.title" [visible]="childSelected" (visibleChange)="hideChildComponent($event)">
  <create-user *ngIf="isComponentSelected(childComponents.createUser)" (created)="onCreated()" ></create-user>
  <edit-user *ngIf="isComponentSelected(childComponents.editUser)"></edit-user>
</app-offcanvas>

<div class="main-content dt" #dtContainer>
  <search-panel [fields]="searchFields" [criteria]="criteria" searchKey="name" searchPlaceholder="Search users..."></search-panel>
  <div class="card">
    <div class="card-body">
      <app-datatable
        [rows]="sb.user.entities()"
        [columns]="columns"
        [headers]="headers"
        [count]="sb.user.pagination()?.total"
        [offset]="getOffsetFromPagination()"
        [limit]="sb.user.pagination()?.perPage"
        [selected]="selected"
        (selectChange)="onSelect($event)"
        (pageChange)="setPage($event)"
        (editClick)="edit($event)"
      ></app-datatable>
    </div>
  </div>
</div>
