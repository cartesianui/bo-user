<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">Security</h4>
</div>

<div class="row mt-3">
  <div class="col-lg-8 col-md-10">
    <div class="card">
      <div class="card-header">
        <h5 class="mb-0">Security</h5>
        <small class="text-muted">Update your password.</small>
      </div>
      <div class="card-body">
        <form autocomplete="off" [formGroup]="formGroupCredentials" (ngSubmit)="onUpdateCredentials()">
          <div class="mb-3">
            <with-validation>
              <label class="form-label">Current Password</label>
              <input validate formControlName="currentPassword" type="password" class="form-control" placeholder="Current Password" requireRelativeTo="newPassword" />
            </with-validation>
          </div>

          <div class="mb-3">
            <with-validation>
              <label class="form-label">New Password</label>
              <input validate formControlName="newPassword" type="password" class="form-control" placeholder="Minimum 8 characters" requireRelativeTo="currentPassword" minlength="8" />
            </with-validation>
          </div>

          <div class="mb-3">
            <with-validation>
              <label class="form-label">Confirm Password</label>
              <input validate formControlName="confirmPassword" type="password" class="form-control" placeholder="Re-enter new password" equalTo="newPassword" />
            </with-validation>
          </div>

          <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-sm btn-primary d-flex align-items-center gap-1" [disabled]="formGroupCredentials.invalid || !formGroupCredentials.dirty">
              <i class="fa fa-save"></i>
              <span>Save Password</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
